<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Owners Evening</title>
<meta name="description" content="Construction Brand — the running order for the Project Owners Evening at Grand Millennium Sulaimani.">
<meta name="theme-color" content="#1C3547">

<!-- Social preview — absolute URLs, because WhatsApp/Telegram scrapers do not
     resolve relative paths, and a raster PNG because they ignore SVG -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://construction-brand.github.io/">
<meta property="og:title" content="Construction Brand — Project Owners Evening">
<meta property="og:description" content="Grand Millennium Sulaimani, Monday 21 September. Tonight's full running order.">
<meta property="og:image" content="https://construction-brand.github.io/assets/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/img/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/css/style.css?v=20260921g">

<!-- Web fonts must never block first paint. A cross-origin stylesheet in
     <head> holds the whole page white until fonts.googleapis.com answers —
     on a saturated ballroom AP that can be tens of seconds, and every script
     below waits with it. Loading it as media="print" makes it non-blocking;
     onload flips it live. The fallback stacks in style.css render at once. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" media="print" onload="this.onload=null;this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"></noscript>
</head>
<body>

<a class="skip" href="#programme">Skip to programme</a>

<!-- ══════════════════════════════════════════════════════════════════
     TITLE BLOCK — modelled on the title block of a construction drawing
     ══════════════════════════════════════════════════════════════ -->
<header class="titleblock">
  <div class="wrap">

    <div class="titleblock__bar">
      <div class="brandmark">
        <span class="brandmark__badge">
          <img src="assets/img/logo.png" alt="Construction Brand"
               onerror="this.onerror=null;this.src='assets/img/logo.svg';">
        </span>
        <span class="brandmark__name">
          <b>CONSTRUCTION</b>
          <i>BRAND</i>
        </span>
      </div>

      <div class="switches">
        <button type="button" id="langBtn" class="switch" data-role="lang">
          <span id="langBtnText">EN</span>
        </button>
        <button type="button" id="themeBtn" class="switch switch--icon" aria-label="Switch appearance">
          <svg viewBox="0 0 24 24" aria-hidden="true" width="17" height="17">
            <path class="ico-sun" d="M12 5v-2M12 21v-2M5 12H3M21 12h-2M6.3 6.3 4.9 4.9M19.1 19.1l-1.4-1.4M17.7 6.3l1.4-1.4M4.9 19.1l1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle class="ico-sun" cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path class="ico-moon" d="M20 14.5A8.2 8.2 0 0 1 9.5 4 8.3 8.3 0 1 0 20 14.5Z" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Hero: the greeting, nothing else. -->
    <h1 class="hero__h1"><span class="hero__hi" id="heroHi">بەخێربێن</span></h1>
  </div>

  <!-- warren truss, lifted from the crane boom in the logo -->
  <div class="truss" aria-hidden="true">
    <svg width="100%" height="14" viewBox="0 0 120 14" preserveAspectRatio="none">
      <defs>
        <pattern id="trussPat" width="20" height="14" patternUnits="userSpaceOnUse">
          <path d="M0 13 L10 1 L20 13" fill="none" stroke="currentColor" stroke-width="1.6"/>
        </pattern>
      </defs>
      <rect x="0" y="0" width="120" height="14" fill="url(#trussPat)"/>
      <rect x="0" y="0" width="120" height="1.6" fill="currentColor"/>
      <rect x="0" y="12.4" width="120" height="1.6" fill="currentColor"/>
    </svg>
  </div>
</header>


<!-- ══════════════════════════════════════════════════════════════════
     VIEW A — THE PROGRAMME
     Shown until 15 minutes before the end. See data/event.js > feedback.
     ══════════════════════════════════════════════════════════════ -->
<div id="viewSchedule">

<!-- LIVE STATUS — countdown before, datum readout during -->
<section class="status" id="status" aria-live="polite">
  <div class="wrap">
    <div class="status__head">
      <span class="pulse" aria-hidden="true"></span>
      <span class="status__label" id="statusLabel">ماوە بۆ دەستپێکردن</span>
    </div>
    <p class="status__value" id="statusValue">—</p>

    <div class="meter" role="img" aria-label="Evening progress" id="meter">
      <span class="meter__fill" id="meterFill"></span>
    </div>
    <p class="meter__caption mono" id="meterCaption">—</p>

    <div class="actions">
      <!-- appears once the feedback window opens, so the programme is never
           a one-way door out of the form -->
      <button type="button" class="btn btn--primary" id="fbGo" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20.5 11.7a8 8 0 0 1-11.9 7L4 20l1.4-4.4A8 8 0 1 1 20.5 11.7Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span data-i18n="fbToFeedback">ناردنی ڕا</span>
      </button>
    </div>
  </div>
</section>


<!-- ══════════════════════════════════════════════════════════════════
     PROGRAMME
     ══════════════════════════════════════════════════════════════ -->
<main class="wrap" id="programme">
  <!-- Agenda card: brand logos, a big title, then a ruled three-column
       table (time · item · duration) — the live now/next/done states are
       applied to the rows by app.js -->
  <section class="agenda">
    <div class="agenda__brands">
      <span class="agenda__brand">
        <!-- mark with CONSTRUCTION BRAND beneath, recomposed so the wordmark
             is readable at plate size; the plates are tall enough to carry it -->
        <img src="assets/img/logo-stack.png" alt="Construction Brand"
             onerror="this.onerror=null;this.src='assets/img/logo.svg';">
      </span>
      <span class="agenda__brand">
        <img src="assets/img/momentum.png" alt="Momentum — chemical & construction materials"
             onerror="this.onerror=null;this.src='assets/img/momentum.svg';">
      </span>
      <span class="agenda__brand">
        <img src="assets/img/pany.png" alt="Pany Construction Solutions"
             onerror="this.onerror=null;this.src='assets/img/pany.svg';">
      </span>
    </div>

    <h2 class="agenda__title" data-i18n="programme">بەرنامە</h2>
    <p class="agenda__meta" id="totalDur"></p>

    <div class="agenda__scroll">
      <table class="agenda__table">
        <thead>
          <tr>
            <th class="c-time" data-i18n="colTime">کات</th>
            <th class="c-item" data-i18n="colItem">بڕگە</th>
            <th class="c-dur"  data-i18n="colDur">ماوە</th>
          </tr>
        </thead>
        <tbody id="rail"></tbody>
      </table>
    </div>
  </section>
</main>


</div><!-- /#viewSchedule -->


<!-- ══════════════════════════════════════════════════════════════════
     VIEW B — FEEDBACK
     Same URL, same QR code. Appears by itself in the closing minutes.
     ══════════════════════════════════════════════════════════════ -->
<section id="viewFeedback" hidden>
  <div class="wrap">

    <p class="fb__eyebrow" id="fbEyebrow"></p>
    <h2 class="fb__title" id="fbTitle"></h2>
    <p class="fb__lead" id="fbLead"></p>

    <form id="fbForm" novalidate>

      <div class="fb__group">
        <label class="fb__legend" for="fbComment" id="fbCommentLabel"></label>
        <textarea id="fbComment" name="comment" rows="7" class="fb__big"></textarea>
      </div>

      <p class="fb__error" id="fbError" role="alert" hidden></p>
      <button type="submit" class="btn btn--primary btn--wide" id="fbSend"></button>
    </form>

    <div class="fb__done" id="fbDone" hidden>
      <span class="fb__tick" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <h3 class="fb__doneTitle" id="fbThanksTitle"></h3>
      <p class="fb__doneBody" id="fbThanksBody"></p>
      <!-- WhatsApp hand-off only: a real link, because in-app browsers ignore
           window.open, and a way back so the answers are never trapped -->
      <a class="btn btn--primary btn--wide" id="fbWaLink" href="#" target="_blank" rel="noopener" hidden></a>
      <button type="button" class="fb__linkbtn" id="fbWaBack" hidden></button>
    </div>

    <p class="fb__back"><a href="?view=schedule" id="fbBack"></a></p>
  </div>

  <!-- Google Forms accepts a plain form POST. The response lands here and is
       discarded; cross-origin rules stop us reading it, which is expected. -->
  <iframe name="cbFbSink" id="cbFbSink" title="form target" hidden></iframe>
</section>


<!-- ══════════════════════════════════════════════════════════════════
     CONTACT — shown under both views
     ══════════════════════════════════════════════════════════════ -->
<section class="wrap block">
  <div class="sechead">
    <h2 data-i18n="contactTitle">پەیوەندی</h2>
  </div>
  <div class="contact" id="contact"></div>
</section>


<footer class="foot">
  <div class="wrap">
    <div class="truss foot__truss" aria-hidden="true">
      <svg width="100%" height="14" viewBox="0 0 120 14" preserveAspectRatio="none">
        <rect x="0" y="0" width="120" height="14" fill="url(#trussPat)"/>
        <rect x="0" y="0" width="120" height="1.6" fill="currentColor"/>
        <rect x="0" y="12.4" width="120" height="1.6" fill="currentColor"/>
      </svg>
    </div>

    <!-- the second way into the form: available at any hour, not only once
         the clock hands it over -->
    <div class="foot__cta">
      <button type="button" class="btn btn--primary" id="fbFoot">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M20.5 11.7a8 8 0 0 1-11.9 7L4 20l1.4-4.4A8 8 0 1 1 20.5 11.7Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span data-i18n="fbToFeedback">ناردنی ڕا</span>
      </button>
    </div>

    <!-- Social media -->
    <div class="social">
      <p class="social__title" data-i18n="socialTitle">سۆشیال میدیا</p>
      <div class="social__row" id="social"></div>
    </div>

    <p class="foot__mark mono">CONSTRUCTION BRAND</p>
  </div>
</footer>

<!-- ?v= is a cache-buster: GitHub Pages caches for 10 minutes, and a change
     to the schedule must reach every phone on the next load, not the one
     after. Bump it whenever data/event.js or app.js changes. -->
<script src="data/event.js?v=20260921j"></script>
<script src="assets/js/app.js?v=20260921f"></script>
</body>
</html>
